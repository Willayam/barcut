name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.toml", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barcut-website
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the Mac installer is available
        run: curl -fsSLI https://github.com/Willayam/barcut/releases/latest/download/BarCut.dmg > /dev/null
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: deploy
