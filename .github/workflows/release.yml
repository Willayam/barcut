name: Release

# A merge to main that changes the app builds, signs, notarizes and publishes a release.
# The release takes the version in Info.plist, or the last release plus one patch when that
# version is already out. Run the workflow by hand to publish main without an app change.

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Assets/**"
      - "Info.plist"
      - "Package.swift"
      - "scripts/build-app.sh"
      - "scripts/package-release.sh"
      - "scripts/dmg-settings.py"
  workflow_dispatch:

permissions:
  contents: write

# A second merge waits here, so it numbers itself after the release in front of it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pick the version and write it into the build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          committed=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          released=$(gh release view --json tagName --jq .tagName)
          IFS=. read -r major minor patch <<< "${released#v}"
          version=$(printf '%s\n' "$committed" "$major.$minor.$((patch + 1))" | sort -V | tail -n 1)
          # The build number is the commit count, so it rises with every release.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" \
            -c "Set :CFBundleVersion $(git rev-list --count HEAD)" Info.plist
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          : "${APPLE_CERTIFICATE:?Missing signing certificate}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing certificate password}"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          cert="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$cert"' EXIT
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$cert"
          security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$keychain"
          security find-certificate -c "Apple Root CA" -p /System/Library/Keychains/SystemRootCertificates.keychain > "$RUNNER_TEMP/apple-root.pem"
          security add-certificates -k "$keychain" "$RUNNER_TEMP/apple-root.pem"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
      - name: Build, notarize and package
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: ./scripts/package-release.sh
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$tag" release/* --generate-notes --target "$GITHUB_SHA"
          test "$(gh release view --json tagName --jq .tagName)" = "$tag"
          curl -fsSLI --retry 5 --retry-delay 5 https://github.com/Willayam/barcut/releases/latest/download/BarCut.dmg > /dev/null
